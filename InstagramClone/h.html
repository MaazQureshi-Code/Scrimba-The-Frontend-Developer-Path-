<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <link rel="stylesheet" href="./style.css">

    <title>Oldagram</title>
</head>

<body>
    <header class="site-header">
        <h1>Oldagram</h1>
        <img
            src="./kabul.jpg"
            alt="life is not easy "
            class="profile-image"
        >
    </header>
    <main>
        <article class="post">
            <header class="post-header">
                <img
                    src="./kabul.jpg"
                    alt="Maaz Qureshi's profile picture"
                    class="profile-image"
                >

                <div class="user-information">
                    <p class="username">
                        <strong>Maaz Qureshi</strong>
                    </p>
                    <p class="location">Kabul, Afghanistan</p>
                </div>
            </header>

            <figure class="post-media">
                <img
                    src="./kabul.jpg"
                    alt="Green mountains surrounding a valley"
                    class="x"
                >
            </figure>
            <section class="reaction-section" aria-label="Post reactions and caption">
                <div class="actions">
                    <button type="button" aria-label="Like this post">
                        <i class="fa-regular fa-heart" aria-hidden="true"></i>
                    </button>

                    <button type="button" aria-label="Comment on this post">
                        <i class="fa-regular fa-comment" aria-hidden="true"></i>
                    </button>

                    <button type="button" aria-label="Share this post">
                        <i class="fa-regular fa-paper-plane" aria-hidden="true"></i>
                    </button>
                </div>
                <p class="likes">
                    <strong>21,492 likes</strong>
                </p>
                <p class="caption">
                    <strong>vincey1853</strong>
                    <span>Just took a few mushrooms lol</span>
                </p>
            </section>
        </article>
    </main>
</body>
</html>
