<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maaz Diner</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./index.js" defer></script>
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>Maaz Diner</h1>
            <p>The best burgers and pizza in town</p>
        </div>
    </header>

    <main>
        <section class="menu" id="menu" aria-label="Restaurant menu">
            <article class="menu-item">
                <div class="menu-image" aria-hidden="true">🍕</div>

                <div class="menu-content">
                    <h2>Pizza</h2>
                    <p>Pepperoni, mushroom, mozzarella</p>
                    <span>$14</span>
                </div>

                <button
                    class="add-btn"
                    data-item-id="1"
                    type="button"
                    aria-label="Add Pizza"
                >
                    +
                </button>
            </article>

            <article class="menu-item">
                <div class="menu-image" aria-hidden="true">🍺</div>

                <div class="menu-content">
                    <h2>Beer</h2>
                    <p>Grain, hops, yeast, water</p>
                    <span>$12</span>
                </div>

                <button
                    class="add-btn"
                    data-item-id="2"
                    type="button"
                    aria-label="Add Beer"
                >
                    +
                </button>
            </article>
        </section>

        <section class="order hidden" id="order-section">
            <h2>Your order</h2>

            <div id="order-list"></div>

            <div class="order-total">
                <h3>Total price:</h3>
                <p id="total-price">$0</p>
            </div>

            <button type="button" class="complete-order-btn">
                Complete order
            </button>
        </section>

        <section class="card-details" aria-hidden="true">
            <form id="payment-form">
                <h2>Enter card details</h2>

                <label>
                    Name
                    <input
                        type="text"
                        id="customer-name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >
                </label>

                <label>
                    Card number
                    <input
                        type="text"
                        id="card-number"
                        name="card-number"
                        inputmode="numeric"
                        placeholder="Enter your card number"
                        required
                    >
                </label>

                <label>
                    CVV
                    <input
                        type="text"
                        id="cvv"
                        name="cvv"
                        inputmode="numeric"
                        maxlength="4"
                        placeholder="Enter CVV"
                        required
                    >
                </label>

                <button type="submit" class="pay-btn">Pay</button>
                <button type="button" class="cancel-btn">Cancel</button>
            </form>
        </section>

        <section class="success-message hidden" id="success-message"></section>
    </main>
</body>
</html>
